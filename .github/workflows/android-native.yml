name: Android Native Launcher
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Discover existing Android command-line tools
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install pinned Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build native debug APK and run local tests
        run: gradle --no-daemon -p android :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Upload unsigned-for-release debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phios-mobile-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
