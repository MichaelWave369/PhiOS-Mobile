name: Verify Rung 1
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: npm run check
      - name: Core unit tests
        run: npm test
      - name: Static site build
        run: npm run build
      - name: Check built entrypoints
        run: test -f dist/index.html && test -f dist/src/main.js && test -f dist/sw.js
